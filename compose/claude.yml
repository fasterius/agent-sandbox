# Claude Code, using the Anthropic API; for use with `agent-sandbox claude`
services:
  # Forwards requests to the hosts in `proxy/model-claude` only, so that the
  # agent can reach its model without any other route out
  proxy:
    extends:
      file: common.yml
      service: hardened
    image: kalaksi/tinyproxy:latest
    volumes:
      - ../proxy/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ../proxy/model-claude:/etc/tinyproxy/filter:ro
    networks:
      - claude-net
      - proxy-egress

  claude:
    extends:
      file: common.yml
      service: agent
    build:
      context: ..
      target: claude
      args:
        UID: ${HOST_UID:?HOST_UID must be set}
        GID: ${HOST_GID:?HOST_GID must be set}
    # One image per architecture, so that switching does not overwrite the
    # other; the platform itself is set in `common.yml`
    image: claude-sandbox:${SANDBOX_ARCH:?SANDBOX_ARCH must be set}
    environment:
      HTTPS_PROXY: http://proxy:8888
      HTTP_PROXY: http://proxy:8888
      NO_PROXY: localhost,127.0.0.1
      # The long-lived login token, passed on from `agent-sandbox` if set
      CLAUDE_CODE_OAUTH_TOKEN:
    volumes:
      # `AGENT_HOME` is set by `agent-sandbox`
      - ${AGENT_HOME:?AGENT_HOME must be set}:/home/dev
    networks:
      - claude-net
    depends_on:
      - proxy

networks:
  claude-net:
    driver: bridge
    internal: true
  proxy-egress:
    driver: bridge
