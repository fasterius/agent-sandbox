# This compose file overrides the network-limiting settings of
# `claude.yml`, while retaining all the other settings; for use with
# `agent-sandbox claude`
services:
  claude:
    # No proxy in this mode: unset the vars `common.yml` sets on the base
    # service so egress is allowed and don't start the proxy
    environment:
      HTTPS_PROXY: ""
      HTTP_PROXY: ""
      NO_PROXY: ""
    depends_on: !reset []

networks:
  claude-net:
    # Allow networking
    internal: false
