# This compose file overrides the network-limiting settings of
# `compose-opencode.yml`, while retaining all the other settings; for use with
# `run-opencode-egress-open.sh`
services:
  opencode:
    # No proxy in this mode: unset the vars `compose-common.yml` sets on the
    # base service so egress is allowed
    environment:
      HTTPS_PROXY: ""
      HTTP_PROXY: ""
      NO_PROXY: ""
      # Network features that are blocked in the egress-filtered mode
      OPENCODE_DISABLE_MODELS_FETCH: "false"
      OPENCODE_DISABLE_LSP_DOWNLOAD: "false"

networks:
  opencode-net:
    # Allow networking
    internal: false
