# OpenCode against a local model server (e.g. llama.cpp) running natively on the
# host on port 8080; for use with `agent-sandbox opencode`
services:
  # Forwards plain TCP from the internal network to the model server on the
  # host, so that the agent can reach it without any other route out
  llm:
    extends:
      file: common.yml
      service: hardened
    image: alpine/socat:latest
    user: "65534:65534"
    command:
      - tcp-listen:8080,fork,reuseaddr
      - tcp-connect:host.docker.internal:8080
    # Docker Desktop provides `host.docker.internal` already; this makes it
    # resolve on plain Linux Docker as well
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      opencode-net:
        aliases:
          - llm.internal
      llm-egress: {}

  opencode:
    extends:
      file: common.yml
      service: agent
    build:
      context: ..
      target: opencode
      args:
        UID: ${HOST_UID:?HOST_UID must be set}
        GID: ${HOST_GID:?HOST_GID must be set}
    # One image per architecture, so that switching does not overwrite the
    # other; the platform itself is set in `common.yml`
    image: opencode-sandbox:${SANDBOX_ARCH:?SANDBOX_ARCH must be set}
    environment:
      # Skip network features that can't work without egress
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      OPENCODE_DISABLE_MODELS_FETCH: "true"
      OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
    volumes:
      # `AGENT_HOME` is set by `agent-sandbox`
      - ${AGENT_HOME:?AGENT_HOME must be set}:/home/dev${SELINUX_LABEL:-}
      # The connection to the model server, which the user's config can't change
      - ../opencode/opencode.jsonc:/etc/opencode/opencode.jsonc:ro${SELINUX_OPT:-}
      - ${LLM_API_KEY_FILE:?LLM_API_KEY_FILE must be set}:/run/secrets/llm-api-key:ro${SELINUX_OPT:-}
    networks:
      - opencode-net
    depends_on:
      - llm

networks:
  opencode-net:
    driver: bridge
    internal: true
  llm-egress:
    driver: bridge
