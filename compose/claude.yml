services:
  proxy:
    extends:
      file: common.yml
      service: proxy
    volumes:
      - ../proxy/filter-claude:/etc/tinyproxy/filter:ro
    networks:
      - claude-net
      - proxy-egress

  claude:
    extends:
      file: common.yml
      service: agent
    build:
      context: ..
      target: claude
    # One image per architecture, so that switching does not overwrite the
    # other; the platform itself is set in `common.yml`
    image: claude-sandbox:${SANDBOX_ARCH:-arm64}
    volumes:
      # Mount `.claude` and `.claude.json` into the container's home
      # directory; `CLAUDE_HOME` is set in the helper script
      - ${CLAUDE_HOME:?CLAUDE_HOME must be set}:/home/dev
    networks:
      - claude-net
    depends_on:
      - proxy

networks:
  claude-net:
    driver: bridge
    internal: true
  proxy-egress:
    driver: bridge
