# OpenCode against a local Ollama server running natively on the host; for use
# with `agent-sandbox opencode`
services:
  proxy:
    extends:
      file: common.yml
      service: proxy
    networks:
      - opencode-net
      - proxy-egress

  # Forwards plain TCP from the internal network to Ollama on the host, so
  # that the agent can reach it without any other route out
  ollama:
    extends:
      file: common.yml
      service: hardened
    image: alpine/socat:latest
    restart: unless-stopped
    user: "65534:65534"
    command:
      - tcp-listen:11434,fork,reuseaddr
      - tcp-connect:host.docker.internal:11434
    # Docker Desktop provides `host.docker.internal` already; this makes it
    # resolve on plain Linux Docker as well
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      opencode-net:
        # Ollama only accepts host names it considers local, such as those
        # ending in `.internal`, when it listens on the loopback interface
        aliases:
          - ollama.internal
      proxy-egress: {}

  opencode:
    extends:
      file: common.yml
      service: agent
    build:
      context: ..
      target: opencode
    # One image per architecture, so that switching does not overwrite the
    # other; the platform itself is set in `common.yml`
    image: opencode-sandbox:${SANDBOX_ARCH:?SANDBOX_ARCH must be set}
    environment:
      # Talk to the forwarder directly rather than through the proxy
      NO_PROXY: localhost,127.0.0.1,ollama.internal
      # Skip network features that the allow-list blocks anyway
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      OPENCODE_DISABLE_MODELS_FETCH: "true"
      OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
    volumes:
      # `AGENT_HOME` is set by `agent-sandbox`
      - ${AGENT_HOME:?AGENT_HOME must be set}:/home/dev
    networks:
      - opencode-net
    depends_on:
      - proxy
      - ollama

networks:
  opencode-net:
    driver: bridge
    internal: true
  proxy-egress:
    driver: bridge
