# Shared service definitions, used via `extends` by the per-agent compose files;
# never run directly. All the environment variables (with defaults) are set by
# `agent-sandbox`.
services:
  hardened:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  proxy:
    extends:
      service: hardened
    image: kalaksi/tinyproxy:latest
    restart: unless-stopped
    volumes:
      - ../proxy/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ${PROXY_FILTER:?PROXY_FILTER must be set}:/etc/tinyproxy/filter:ro

  agent:
    extends:
      service: hardened
    platform: linux/${SANDBOX_ARCH:?SANDBOX_ARCH must be set}
    # Interactivity
    stdin_open: true
    tty: true
    environment:
      HTTPS_PROXY: http://proxy:8888
      HTTP_PROXY: http://proxy:8888
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - ${PROJECT_DIR:?PROJECT_DIR must be set}:/home/dev/workspace
    # Upper limits rather than reservations. The PID limit counts threads as
    # well as processes
    mem_limit: ${SANDBOX_MEMORY:?SANDBOX_MEMORY must be set}
    cpus: ${SANDBOX_CPUS:?SANDBOX_CPUS must be set}
    pids_limit: ${SANDBOX_PIDS:?SANDBOX_PIDS must be set}
