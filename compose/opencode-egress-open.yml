# This compose file overrides the network-limiting settings of `opencode.yml`,
# while retaining all the other settings; for use with `agent-sandbox opencode`
services:
  opencode:
    # No proxy in this mode: unset the vars `common.yml` sets on the base
    # service so egress is allowed and don't start the proxy
    environment:
      HTTPS_PROXY: ""
      HTTP_PROXY: ""
      NO_PROXY: ""
      # Network features that the proxy blocks in the other modes
      OPENCODE_DISABLE_MODELS_FETCH: "false"
      OPENCODE_DISABLE_LSP_DOWNLOAD: "false"
    depends_on: !override
      - llm

networks:
  opencode-net:
    # Allow networking
    internal: false
