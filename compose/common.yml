# Shared service definitions, used via `extends` by the per-agent compose files;
# never run directly. All the environment variables (with defaults) are set by
# `agent-sandbox`.
services:
  hardened:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:builtin

  agent:
    extends:
      service: hardened
    platform: linux/${SANDBOX_ARCH:?SANDBOX_ARCH must be set}
    # Interactivity
    stdin_open: true
    tty: true
    # The project is mounted at the same path as on the host, so that agents
    # that key their per-project data by path (_e.g._ Claude Code's history and
    # memory) keep it separate per project
    working_dir: ${PROJECT_DIR:?PROJECT_DIR must be set}
    volumes:
      - ${PROJECT_DIR}:${PROJECT_DIR}
    # Upper limits rather than reservations. The PID limit counts threads as
    # well as processes
    mem_limit: ${SANDBOX_MEMORY:?SANDBOX_MEMORY must be set}
    cpus: ${SANDBOX_CPUS:?SANDBOX_CPUS must be set}
    pids_limit: ${SANDBOX_PIDS:?SANDBOX_PIDS must be set}
