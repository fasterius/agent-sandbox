services:
  proxy:
    extends:
      file: compose-common.yml
      service: proxy
    volumes:
      - ./filter:/etc/tinyproxy/filter:ro
    networks:
      - claude-net
      - proxy-egress

  claude:
    extends:
      file: compose-common.yml
      service: agent
    build:
      context: .
      target: claude
      platforms:
        - linux/amd64
    image: claude-sandbox:latest
    volumes:
      # Mount `.claude` and `.claude.json` into the container's home
      # directory; `CLAUDE_HOME` is set in the helper script
      - ${CLAUDE_HOME:?CLAUDE_HOME must be set}:/home/dev
    networks:
      - claude-net
    depends_on:
      - proxy

networks:
  claude-net:
    driver: bridge
    internal: true
  proxy-egress:
    driver: bridge
