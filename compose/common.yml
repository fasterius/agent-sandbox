# Shared service definitions, used via `extends` by the per-agent compose
# files; never run directly
services:
  hardened:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  proxy:
    extends:
      service: hardened
    image: kalaksi/tinyproxy:latest
    restart: unless-stopped
    volumes:
      - ../proxy/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro

  agent:
    extends:
      service: hardened
    # Native `arm64` by default; `amd64` runs under emulation on Apple Silicon
    # but matches the `linux-64` packages and CI of most projects. Override per
    # run with the `SANDBOX_ARCH` environment variable
    platform: linux/${SANDBOX_ARCH:-arm64}
    # Interactivity
    stdin_open: true
    tty: true
    environment:
      HTTPS_PROXY: http://proxy:8888
      HTTP_PROXY: http://proxy:8888
      NO_PROXY: localhost,127.0.0.1
    volumes:
      # The `PROJECT_DIR` env variable is set in the helper scripts
      - ${PROJECT_DIR:?PROJECT_DIR must be set}:/home/dev/workspace
    # Upper limits rather than reservations; override per run with the
    # `SANDBOX_MEMORY`, `SANDBOX_CPUS` and `SANDBOX_PIDS` environment variables.
    # The PID limit counts threads as well as processes
    mem_limit: ${SANDBOX_MEMORY:-4g}
    cpus: ${SANDBOX_CPUS:-2}
    pids_limit: ${SANDBOX_PIDS:-512}
