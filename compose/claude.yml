# Claude Code, using the Anthropic API; for use with `agent-sandbox claude`
services:
  proxy:
    extends:
      file: common.yml
      service: proxy
    networks:
      - claude-net
      - proxy-egress

  claude:
    extends:
      file: common.yml
      service: agent
    build:
      context: ..
      target: claude
    # One image per architecture, so that switching does not overwrite the
    # other; the platform itself is set in `common.yml`
    image: claude-sandbox:${SANDBOX_ARCH:?SANDBOX_ARCH must be set}
    volumes:
      # `AGENT_HOME` is set by `agent-sandbox`
      - ${AGENT_HOME:?AGENT_HOME must be set}:/home/dev
    networks:
      - claude-net
    depends_on:
      - proxy

networks:
  claude-net:
    driver: bridge
    internal: true
  proxy-egress:
    driver: bridge
