# OpenCode against a local model server (e.g. llama.cpp) running natively on the
# host on port 8080; for use with `agent-sandbox opencode`
services:
  proxy:
    extends:
      file: common.yml
      service: proxy
    networks:
      - opencode-net
      - proxy-egress

  # Forwards plain TCP from the internal network to the model server on the
  # host, so that the agent can reach it without any other route out
  llm:
    extends:
      file: common.yml
      service: hardened
    image: alpine/socat:latest
    restart: unless-stopped
    user: "65534:65534"
    command:
      - tcp-listen:8080,fork,reuseaddr
      - tcp-connect:host.docker.internal:8080
    # Docker Desktop provides `host.docker.internal` already; this makes it
    # resolve on plain Linux Docker as well
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      opencode-net:
        aliases:
          - llm.internal
      proxy-egress: {}

  opencode:
    extends:
      file: common.yml
      service: agent
    build:
      context: ..
      target: opencode
    # One image per architecture, so that switching does not overwrite the
    # other; the platform itself is set in `common.yml`
    image: opencode-sandbox:${SANDBOX_ARCH:?SANDBOX_ARCH must be set}
    environment:
      # Talk to the forwarder directly rather than through the proxy
      NO_PROXY: localhost,127.0.0.1,llm.internal
      # Skip network features that the allow-list blocks anyway
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      OPENCODE_DISABLE_MODELS_FETCH: "true"
      OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
    volumes:
      # `AGENT_HOME` is set by `agent-sandbox`
      - ${AGENT_HOME:?AGENT_HOME must be set}:/home/dev
    secrets:
      - llm-api-key
    networks:
      - opencode-net
    depends_on:
      - proxy
      - llm

secrets:
  # The model server's API key (empty for a server without one), mounted at
  # `/run/secrets/llm-api-key`; `LLM_API_KEY_FILE` is set by `agent-sandbox`
  llm-api-key:
    file: ${LLM_API_KEY_FILE:?LLM_API_KEY_FILE must be set}

networks:
  opencode-net:
    driver: bridge
    internal: true
  proxy-egress:
    driver: bridge
