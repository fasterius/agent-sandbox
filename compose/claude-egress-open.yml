# This compose file overrides the network-limiting settings of
# `claude.yml`, while retaining all the other settings; for use with
# `run-agent.sh claude open`
services:
  claude:
    # No proxy in this mode: unset the vars `common.yml` sets on the
    # base service so egress is allowed
    environment:
      HTTPS_PROXY: ""
      HTTP_PROXY: ""
      NO_PROXY: ""

networks:
  claude-net:
    # Allow networking
    internal: false
